<div class="max-w-3xl mx-auto bg-white p-6 rounded shadow">
      <button routerLink="/" class="text-sm text-gray-500 hover:underline">&larr; Back</button>
      <h1 class="text-2xl font-bold mt-3">{{ blog?.title }}</h1>
      <p class="text-sm text-gray-500">By {{ blog?.author }} • {{ blog?.date | date:'medium' }}</p>
      <img *ngIf="blog?.imageUrl" [src]="blog?.imageUrl" class="w-full h-60 object-cover rounded mt-4">
      <div class="prose mt-4" [innerHTML]="blog?.content"></div>
    </div>
