<div class="max-w-md mx-auto bg-white p-6 rounded shadow">
      <h2 class="text-xl font-bold mb-4">Admin Login</h2>
      <form (submit)="login($event)">
        <div class="mb-3">
          <label class="block text-sm">Username</label>
          <input [(ngModel)]="username" name="username" class="w-full border rounded p-2" />
        </div>
        <div class="mb-3">
          <label class="block text-sm">Password</label>
          <input [(ngModel)]="password" name="password" type="password" class="w-full border rounded p-2" />
        </div>
        <div class="flex justify-between items-center">
          <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded">Login</button>
          <a routerLink="/" class="text-sm text-gray-500 hover:underline">Back</a>
        </div>
        <p *ngIf="err" class="text-red-500 mt-2">{{ err }}</p>
      </form>
    </div>
